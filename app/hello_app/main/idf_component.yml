## IDF Component Manager Manifest File
dependencies:
  idf:
    version: ">=5.5.3"
  espressif/esp_wifi_remote:
    version: "0.14.*"
    
  espressif/esp_hosted:
    version: "2.12.*"

  espressif/esp-brookesia:
    version: "0.4.*"

  esp_video:
    version: "2.0.*"
    public: true

  espressif/esp_lvgl_adapter:
    version: "0.5.*"
    public: true

  # Streaming voice transport/codec. The design follows the queue-based
  # 60 ms Opus pipeline used by 78/xiaozhi-esp32, while keeping this board's
  # existing UI, BSP audio and ESP-Hosted networking layers.
  espressif/esp_websocket_client:
    version: "^1.5.0"

  espressif/esp_audio_codec:
    version: "~2.5.0"
